name: Check

# Pull Request 校验：Go 代码、全部应用、版本规则与网站构建。不使用任何密钥，
# fork 提交的 PR 同样安全运行。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 固定工具链：Go 取 go.mod 的版本，Node 22 + pnpm。应用的界面 / 后端源码（build.json）
      # 在校验与生成数据时构建；网站按 workspace:* 使用 desk-ui 子模块的源码，工作区与锁文件在仓库根目录。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Go format, vet and tests
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "请运行 gofmt"; exit 1; }
          go vet ./...
          go test ./...
      - name: Validate apps
        run: go run ./cmd/appcheck check
      - name: Version rules against the published store
        # 与线上已发布数据对比：改了安装包必须提升版本，已发布的版本号不能复用。
        run: go run ./cmd/appcheck build -out dist/public -previous "$(jq -r .homepage store.config.json)api/v1"
      - name: Reproducible builds
        # 同一提交构建两次，安装包必须逐字节一致（含从源码构建的界面与后端模块）。
        run: |
          go run ./cmd/appcheck build -out dist/repro -previous "$(jq -r .homepage store.config.json)api/v1"
          diff -r dist/public/api/v1/packages dist/repro/api/v1/packages
      - name: Permission summary of changed apps
        if: github.event_name == 'pull_request'
        run: |
          base="$(jq -r .homepage store.config.json)api/v1"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- apps/ | cut -d/ -f2 | sort -u)
          mkdir -p dist
          summary="dist/pr-permission-summary.md"
          {
            echo "<!-- desk-store-permission-summary -->"
            echo "## 权限摘要"
            if [ -z "$changed" ]; then
              echo "- 本次 Pull Request 未修改 \`apps/\` 目录。"
            fi
            for slug in $changed; do
              if [ -d "apps/$slug" ]; then
                go run ./cmd/appcheck summary "apps/$slug" -base "$base"
                echo
              else
                echo "- 删除了 \`$slug\`（发布后会显示为已下架）"
              fi
            done
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment permission summary on Pull Request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          summary="dist/pr-permission-summary.md"
          [ -s "$summary" ] || exit 0
          marker="<!-- desk-store-permission-summary -->"
          existing=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing}" -F "body=@${summary}" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -F "body=@${summary}" >/dev/null
          fi
      - name: Build the website
        run: |
          pnpm install --frozen-lockfile
          pnpm build
